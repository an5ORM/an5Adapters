[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "an5-adapters"
version = "0.2.9"
description = "Python adapter helpers for AN5 ORM."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "an5ORM" }]
license = { text = "MIT" }
keywords = ["an5", "orm", "adapter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License"
]
dependencies = [
  "pyodbc>=5.0",
  "psycopg2-binary>=2.9"
]

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["an5_adapter", "table_client"]
# `sqlite` phải có ở đây, nếu không nó bị bỏ khỏi gói cài đặt: bản build chỉ đóng
# gói liệt kê tường minh, nên `import sqlite.provider` sẽ hỏng ở máy đã cài
# trong khi vẫn chạy được khi bạn cài kiểu editable từ checkout.
packages = ["base", "mssql", "postgres", "sqlite"]

[tool.pyright]
extraPaths = ["python"]

