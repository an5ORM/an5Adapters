[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "an5-adapters"
version = "0.2.13"
description = "Python adapter helpers for AN5 ORM."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "an5ORM" }]
license = { text = "MIT" }
keywords = ["an5", "orm", "adapter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License"
]
dependencies = [
  "pyodbc>=5.0",
  "psycopg2-binary>=2.9"
]

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["an5_adapter", "table_client"]
# `sqlite` has to be listed here, or it is dropped from the installed package: the
# build only closes over the packages named explicitly, so `import sqlite.provider`
# breaks on a machine that installed the wheel while it still works from a checkout.
packages = ["base", "mssql", "postgres", "sqlite"]

[tool.pyright]
extraPaths = ["python"]

